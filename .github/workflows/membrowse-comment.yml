name: MemBrowse PR Comment

# Posts the MemBrowse memory report as a PR comment. Runs from the base repo
# context via workflow_run so it works for PRs from forks.
# The workflows: value must match the name: of membrowse-report.yml.

on:
  workflow_run:
    workflows: [MemBrowse Memory Report]
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    runs-on: ubuntu-latest
    # Run even if some builds failed, but skip cancelled and skipped runs.
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled' &&
      github.event.workflow_run.conclusion != 'skipped'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Post combined PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        uses: membrowse/membrowse-action/comment-action@b68ef88e116c5fc1518d4e5766d7e0f6ca2926d6 # v1.2.13
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
